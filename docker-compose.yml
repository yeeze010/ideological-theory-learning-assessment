services:
  postgres:
    image: postgres:16-alpine
    container_name: assessment-postgres
    environment:
      POSTGRES_DB: assessment
      POSTGRES_USER: assessment
      POSTGRES_PASSWORD: assessment
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U assessment -d assessment"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: assessment-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: assessment-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: assessment
      MINIO_ROOT_PASSWORD: assessment-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: assessment-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    environment:
      PORT: 3000
      JWT_SECRET: change-me-in-production
      DATABASE_URL: postgresql://assessment:assessment@postgres:5432/assessment
      REDIS_URL: redis://redis:6379
      CORS_ORIGIN: http://localhost
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: assessment-web
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  postgres-data:
  redis-data:
  minio-data:
